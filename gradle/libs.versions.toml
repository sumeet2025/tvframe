[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
coreKtx = "1.15.0"
appcompat = "1.7.0"
composeBom = "2024.11.00"
tvFoundation = "1.0.0-alpha11"
tvMaterial = "1.0.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
room = "2.6.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
retrofit = "2.11.0"
okhttp = "4.12.0"
